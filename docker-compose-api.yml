services:
  api-sindvamb:
    image: sindvamb-application-host:latest
    restart: always
    container_name: sindvamb-application-host
    build:
      context: .
      dockerfile: Sindvamb.Application.Host/Dockerfile
    volumes:
      - api_sindvamb_volume:/app/files
    ports:
      - 5001:8081
      - 5002:8080
    networks:
      - fag_network

networks:
  fag_network:
    external: true  

volumes:
  api_sindvamb_volume:
    external: true      